name: vexokart
description: A modern, production-ready e-commerce mobile application.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  supabase_flutter: ^2.6.0
  provider: ^6.1.1
  google_fonts: ^6.2.1
  razorpay_flutter: ^1.3.5
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.1
  qr_flutter: ^4.1.0
  printing: ^5.12.0
  pdf: ^3.10.7
  shimmer: ^3.0.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
