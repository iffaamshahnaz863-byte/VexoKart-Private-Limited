    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'background': '#FFFFFF',
              'surface': '#F8F9FA',
              'border': '#F1F3F5',
              'accent': '#FF8A00',
              'accent-secondary': '#FF6B00',
              'text-main': '#1A1A1A',
              'text-secondary': '#4A4A4A',
              'text-muted': '#A0A0A0',
            },
            boxShadow: {
              'premium': '0 10px 40px -10px rgba(0, 0, 0, 0.05)',
              'premium-hover': '0 20px 50px -12px rgba(0, 0, 0, 0.1)',
            },
            borderRadius: {
              'xl': '12px',
              '2xl': '16px',
              '3xl': '24px',
              '4xl': '32px',
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
        color: #1A1A1A;
        background-color: #FFFFFF;
      }

      /* PRINTER SAFE CONFIGURATION */
      @media print {
        body * {
          visibility: hidden !important;
        }
        #shipping-label, #shipping-label * {
          visibility: visible !important;
        }
        #shipping-label {
          position: absolute !important;
          left: 0 !important;
          top: 0 !important;
          width: 100mm !important; /* 4 inches approx */
          height: 150mm !important; /* 6 inches approx */
          margin: 0 !important;
          padding: 0 !important;
          border: 1px solid black !important;
          background: white !important;
          color: black !important;
        }
        @page {
          size: 100mm 150mm; /* 4x6 Thermal Label Size */
          margin: 0;
        }
        .no-print {
          display: none !important;
        }
      }

      .reactEasyCrop_Container {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        overflow: hidden;
        user-select: none;
        touch-action: none;
        cursor: move;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .reactEasyCrop_Image {
        max-width: 100%;
        max-height: 100%;
        margin: auto;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        transform-origin: center;
        will-change: transform;
      }
      .reactEasyCrop_CropArea {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 2px solid rgba(255, 255, 255, 0.5);
        box-sizing: border-box;
        box-shadow: 0 0 0 9999em rgba(0, 0, 0, 0.6);
      }

      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #E5E7EB; 
        border-radius: 10px;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      button, a, input, select, textarea {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .scale-in-center {
        animation: scale-in-center 0.3s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
      }
      @keyframes scale-in-center {
        0% { transform: scale(0.98); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
    </style>
