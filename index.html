
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VEXOKART - Premium Products & Accessories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'background': '#FFFFFF',
              'surface': '#F1F2F6', // A light gray like Amazon/Flipkart's bg
              'border': '#E0E0E0',
              'primary': '#2874F0', // Flipkart Blue
              'primary-dark': '#1A5BBD',
              'accent': '#FF9900', // Amazon Orange
              'accent-dark': '#E68A00',
              'text-main': '#172337', // Dark blue/black text
              'text-secondary': '#565656',
              'text-muted': '#878787',
              'success': '#26A541', // Green for discounts/success
            },
            boxShadow: {
              'premium': '0 4px 12px rgba(0, 0, 0, 0.08)',
              'premium-hover': '0 8px 16px rgba(0, 0, 0, 0.12)',
            },
            borderRadius: {
              'xl': '8px',
              '2xl': '12px',
              '3xl': '16px',
              '4xl': '20px',
            }
          }
        }
      }
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap');
      
      body {
        font-family: 'Roboto', sans-serif;
        color: #172337;
        background-color: #FFFFFF;
      }

      /* Consistent focus ring style */
      *:focus-visible {
        outline: 2px solid #2874F0;
        outline-offset: 2px;
        border-radius: 4px;
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #E0E0E0; 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #BDBDBD;
      }

      button, a, input, select, textarea {
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .scale-in-center {
        animation: scale-in-center 0.3s cubic-bezier(0.250, 0.460, 0.450, 0.940) both;
      }
      @keyframes scale-in-center {
        0% { transform: scale(0.98); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
    </style>

  }
}
</script>
